<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts: Rubik (body/UI) + Google Sans (Gavi411 wordmark only)
         — system-font fallback stacks were rendering inconsistently across
         OS/devices, so both are loaded as real webfonts instead of relying
         on whatever's locally installed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <!-- G411-15: PWA installability baseline -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f2a900" />
    <!-- iOS ignores the web manifest for "Add to Home Screen" styling —
         these two tags are the iOS-specific equivalent. apple-touch-icon
         wants a real PNG (iOS doesn't accept SVG here); using the SVG
         favicon as a placeholder until real icon assets exist (see
         gavi411-brain.md / manifest.json comment). -->
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gavi411" />
    <title>Gavi411</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
